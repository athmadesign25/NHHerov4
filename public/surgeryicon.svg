<svg xmlns="http://www.w3.org/2000/svg" width="80" height="64" viewBox="0 0 80 64" fill="none">
  <rect width="80" height="64" rx="16" fill="url(#bgGrad)" fill-opacity="0.25"/>
  <g filter="url(#dropShadow)">
    <!-- Monitor Body -->
    <rect x="14" y="10" width="46" height="34" rx="6" fill="#D9EBFD" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Screen -->
    <rect x="18" y="14" width="38" height="24" rx="4" fill="#3B82F6"/>
    <!-- Heartbeat EKG wave -->
    <path d="M20 26H28L31 20L35 32L39 23L42 26H54" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Monitor Stand -->
    <path d="M33 44V49M43 49H31" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Control Buttons -->
    <circle cx="22" cy="41" r="1.5" fill="#93C5FD"/>
    <circle cx="27" cy="41" r="1.5" fill="#93C5FD"/>
    <circle cx="32" cy="41" r="1.5" fill="#93C5FD"/>
    <!-- Mouse -->
    <rect x="52" y="40" width="14" height="18" rx="7" fill="#E2E8F0" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M59 40V45" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Cable -->
    <path d="M59 40C59 34 50 35 48 40" stroke="#CBD5E1" stroke-width="1.5" fill="none"/>
  </g>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="80" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="white"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="dropShadow" x="8" y="6" width="64" height="54" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>
</svg>
