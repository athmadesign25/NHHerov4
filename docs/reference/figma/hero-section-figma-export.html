<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NH Hero Section Export</title>
    <style>
      :root {
        --color-primary: #034ea2;
        --color-primary-dark: #023070;
        --color-text-inverse: #ffffff;
        --color-border-light: rgba(255, 255, 255, 0.28);
        --radius-xl: 20px;
        --radius-full: 9999px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: #0b0f19;
      }

      .hero {
        position: relative;
        min-height: 100vh;
        width: 100%;
        overflow: hidden;
        color: var(--color-text-inverse);
      }

      .bg-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(11, 15, 25, 0.46);
      }

      .hero-inner {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: 80px;
      }

      .content-grid {
        width: 100%;
        max-width: 1600px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(300px, 320px);
        gap: clamp(72px, 8vw, 112px);
        align-items: center;
      }

      .left-col {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .headline {
        margin: 0;
        font-size: clamp(40px, 4.2vw, 64px);
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }

      .subheadline {
        margin: 0;
        font-size: clamp(24px, 2.4vw, 36px);
        font-weight: 500;
        line-height: 1.25;
      }

      .cta-stack {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        border-radius: var(--radius-full);
        transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-primary {
        min-height: 58px;
        padding: 0 32px;
        background: var(--color-primary);
        color: #fff;
        font-size: 28px;
        font-weight: 700;
        box-shadow: 0 10px 28px rgba(3, 78, 162, 0.32);
      }

      .btn-primary:hover {
        background: var(--color-primary-dark);
        box-shadow: 0 14px 36px rgba(3, 78, 162, 0.42);
      }

      .btn-secondary {
        min-height: 50px;
        padding: 0 24px;
        background: #fff;
        color: var(--color-primary);
        border: 1px solid rgba(255, 255, 255, 0.7);
        font-size: 17px;
        font-weight: 700;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.14);
      }

      .btn-secondary:hover {
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.2);
      }

      .icon {
        width: 20px;
        height: 20px;
        display: inline-flex;
      }

      .icon-lg {
        width: 24px;
        height: 24px;
      }

      .search-divider {
        width: 120px;
        height: 1px;
        background: var(--color-border-light);
        margin-top: 8px;
        margin-bottom: 4px;
      }

      .search-wrap {
        max-width: 840px;
      }

      .search-bar {
        height: 56px;
        border-radius: var(--radius-full);
        border: 1.5px solid rgba(255, 255, 255, 0.45);
        background: rgba(11, 15, 25, 0.65);
        backdrop-filter: blur(28px);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 18px;
      }

      .search-icon-wrap {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }

      .search-placeholder {
        font-size: 30px;
        color: rgba(255, 255, 255, 0.95);
      }

      .right-col {
        justify-self: end;
        width: 320px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .impact-card {
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: var(--radius-xl);
        background: transparent;
        padding: 16px;
      }

      .impact-number {
        margin: 0;
        font-size: clamp(2rem, 3vw, 2.4rem);
        font-weight: 600;
        line-height: 1.05;
      }

      .impact-label {
        margin: 8px 0 0;
        font-size: 14px;
        line-height: 1.4;
        opacity: 0.86;
        white-space: nowrap;
      }

      .scroll-indicator {
        position: absolute;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0.85;
      }

      @media (max-width: 900px) {
        .hero-inner {
          padding: 92px 16px 56px;
        }

        .content-grid {
          grid-template-columns: 1fr;
          gap: 24px;
          align-items: start;
        }

        .right-col {
          width: 100%;
          justify-self: stretch;
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
        }

        .search-divider {
          width: 100%;
          max-width: 100%;
        }
      }

      @media (max-width: 520px) {
        .headline {
          font-size: clamp(32px, 10vw, 44px);
        }

        .subheadline {
          font-size: clamp(19px, 6vw, 28px);
        }

        .cta-row {
          width: 100%;
          display: grid;
          grid-template-columns: 1fr;
        }

        .btn-primary,
        .btn-secondary {
          width: 100%;
          justify-content: center;
        }

        .right-col {
          grid-template-columns: 1fr;
        }

        .impact-label {
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero" id="hero-section">
      <video class="bg-video" autoplay muted loop playsinline>
        <source src="/Hero Video.mp4" type="video/mp4" />
      </video>
      <div class="overlay"></div>

      <div class="hero-inner">
        <div class="content-grid">
          <div class="left-col">
            <div>
              <h1 class="headline">Trusted Care, Every Day</h1>
              <h2 class="subheadline">Compassion Backed by Expertise</h2>
            </div>

            <div class="cta-stack">
              <a class="btn btn-primary" href="#" aria-label="Book Appointment">
                <span class="icon icon-lg" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="m9 15 2 2 4-4"/>
                  </svg>
                </span>
                Book Appointment
              </a>

              <div class="cta-row">
                <a class="btn btn-secondary" href="#" aria-label="Book Health Checkup">
                  <span class="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                    </svg>
                  </span>
                  Book Health Checkup
                </a>
                <a class="btn btn-secondary" href="#" aria-label="Find a Hospital">
                  <span class="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3" y="2" width="18" height="20" rx="2"/><path d="M9 22V8h6v14"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/>
                    </svg>
                  </span>
                  Find a Hospital
                </a>
              </div>
            </div>

            <div class="search-divider"></div>

            <div class="search-wrap">
              <div class="search-bar" role="search" aria-label="Search doctors, specialities, or treatments">
                <span class="search-icon-wrap" aria-hidden="true">
                  <span class="icon" style="color:#034ea2">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
                    </svg>
                  </span>
                </span>
                <span class="search-placeholder">Search doctors, specialities, or treatments...</span>
              </div>
            </div>
          </div>

          <aside class="right-col" aria-label="Impact metrics">
            <article class="impact-card">
              <p class="impact-number">25+</p>
              <p class="impact-label">years of trusted care</p>
            </article>
            <article class="impact-card">
              <p class="impact-number">40+</p>
              <p class="impact-label">world class medical specialities</p>
            </article>
            <article class="impact-card">
              <p class="impact-number">24x7</p>
              <p class="impact-label">care &amp; support</p>
            </article>
            <article class="impact-card">
              <p class="impact-number">4500+</p>
              <p class="impact-label">doctors &amp; teams</p>
            </article>
          </aside>
        </div>
      </div>

      <div class="scroll-indicator" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </div>
    </section>
  </body>
</html>
